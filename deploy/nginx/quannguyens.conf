# ==============================================================================
# CẤU HÌNH NGINX TỐI ƯU CHO QUANNGUYENS (quannguyens.com)
# Đường dẫn cài đặt trên VPS Ubuntu: /etc/nginx/sites-available/quannguyens.conf
# Kích hoạt: ln -s /etc/nginx/sites-available/quannguyens.conf /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name quannguyens.com www.quannguyens.com;

    # Cho phép Certbot xác thực qua Let's Encrypt webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://quannguyens.com$request_uri;
    }
}

# 2. Chuyển hướng https://www.quannguyens.com về domain gốc https://quannguyens.com (Canonical)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.quannguyens.com;

    # Chứng chỉ SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/quannguyens.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quannguyens.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://quannguyens.com$request_uri;
}

# 3. Máy chủ chính phục vụ https://quannguyens.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quannguyens.com;

    # ── SSL & BẢO MẬT HIỆN ĐẠI ──────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/quannguyens.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quannguyens.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── SECURITY HEADERS ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── NÉN GZIP TỐC ĐỘ CAO ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── THƯ MỤC CHỨA BẢN BUILD FRONTEND (Vite dist) ──────────────────────
    root /var/www/quannguyens/dist;
    index index.html;

    # ── QUẢN LÝ TẢI FILE TĨNH & CACHE TRÌNH DUYỆT ────────────────────────
    # Tài nguyên tĩnh đã được Vite đánh hash (immutable cache)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Không cache file index.html để người dùng luôn nhận bản cập nhật mới nhất
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Phục vụ SPA React Router: mọi đường dẫn không trùng file tĩnh đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── REVERSE PROXY ĐẾN BACKEND NODE.JS (PORT 3001) ──────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Truyền thông tin danh tính Client và HTTPS thật về Express
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Giới hạn kích thước tải lên (cho phép gửi hóa đơn/ảnh nếu cần)
        client_max_body_size 10M;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── ĐẶC TRỊ SSE STREAM (Server-Sent Events) CHO THEO DÕI ĐƠN HÀNG ──────
    location = /api/orders/events {
        proxy_pass http://127.0.0.1:3001/api/orders/events;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bắt buộc tắt buffer để tin nhắn SSE đẩy tới khách ngay tức thì (real-time)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Timeout kết nối dài cho luồng sự kiện thời gian thực
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Chặn truy cập trực tiếp vào các file ẩn (.git, .env...)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
