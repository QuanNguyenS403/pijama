name: CI Pipeline & Production Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Test & Security Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.14.0']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify No Real Credentials In Tracked Config & Env Templates
        run: |
          if grep -rnE 'GMAIL_APP_PASSWORD\s*=\s*["'\'']?[a-z]{4}\s+[a-z]{4}\s+[a-z]{4}\s+[a-z]{4}' *.env.example render.yaml 2>/dev/null; then
            echo "ERROR: Real Gmail App Password detected in tracked template!"
            exit 1
          fi
          if grep -rnE 'script\.google\.com/macros/s/AKfy[a-zA-Z0-9_-]+' *.env.example render.yaml 2>/dev/null; then
            echo "ERROR: Real Google Apps Script deployment URL detected in tracked template!"
            exit 1
          fi
          if grep -rnE '^(GMAIL_APP_PASSWORD|GAS_WEBHOOK_SECRET|GMAIL_BRIDGE_SECRET|SUPABASE_SERVICE_ROLE_KEY)\s*=\s*["'\'']?[^"'\''#\s]+' *.env.example 2>/dev/null | grep -vE '(CHANGE_ME|your_|change-me|placeholder|example|xxxx)'; then
            echo "ERROR: Non-empty secret value detected in *.env.example!"
            exit 1
          fi

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install All Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild Native Addons (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Run Automated Test Suite & Verify Minimum Coverage
        shell: bash
        run: |
          set -o pipefail
          npm test | tee /tmp/test-output.txt
          node -e '
            const fs = require("fs");
            const out = fs.readFileSync("/tmp/test-output.txt", "utf8");
            const testMatches = [...out.matchAll(/^[ℹ#]\s*tests\s+(\d+)/gm)];
            const failMatches = [...out.matchAll(/^[ℹ#]\s*fail\s+(\d+)/gm)];
            const total = Number(testMatches[testMatches.length - 1]?.[1] || 0);
            const fail = Number(failMatches[failMatches.length - 1]?.[1] ?? -1);
            console.log("CI test floor check -> total:", total, "fail:", fail);
            if (total < 195) {
              console.error("Expected >= 195 executed tests (check glob/discovery)!");
              process.exit(1);
            }
            if (fail !== 0) {
              console.error("Test suite had failures:", fail);
              process.exit(1);
            }
          '

      - name: Audit Production Dependencies
        run: |
          npm audit --omit=dev --audit-level=critical
          npm audit --omit=dev || true

      - name: Build Production Frontend Artifacts
        run: npm run build

      - name: Verify Production Dist Exists
        run: |
          test -d dist
          test -f dist/index.html

      - name: Verify Production Dependencies Only
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Verify Fail-Closed On Missing Production Secrets
        run: |
          if env -u CI NODE_ENV=production npm start; then
            echo "ERROR: Server started in production without required secrets!"
            exit 1
          else
            echo "OK: Server correctly refused to start without required production secrets"
          fi

      - name: Smoke Test Production Startup With Required Env
        env:
          CI: ''
          PORT: '3999'
          APP_URL: 'https://ci-smoke.example.invalid'
          ALLOWED_ORIGINS: 'https://ci-smoke.example.invalid'
          ADMIN_PASSWORD: 'ci-smoke-dummy-admin-password-32ch'
          ADMIN_SESSION_SECRET: 'ci-smoke-dummy-admin-session-secret-32c'
          ORDER_TOKEN_SECRET: 'ci-smoke-dummy-order-token-secret-32ch'
          CUSTOMER_AUTH_SECRET: 'ci-smoke-dummy-customer-auth-secret-32ch'
          JWT_SECRET: 'ci-smoke-dummy-jwt-secret-key-length-32ch'
          GMAIL_USER: 'ci-smoke@example.invalid'
          OWNER_EMAIL: 'owner-smoke@example.invalid'
          GAS_EMAIL_WEBHOOK_URL: 'https://script.google.com/macros/s/ci-smoke/exec'
          GAS_WEBHOOK_SECRET: 'ci-smoke-dummy-gas-webhook-secret-32ch'
          GMAIL_BRIDGE_SECRET: 'ci-smoke-dummy-gmail-bridge-secret-32c'
          SEPAY_WEBHOOK_API_KEY: 'ci-smoke-dummy-sepay-webhook-key-32chars'
          BANK_CODE: 'VCB'
          BANK_ACCOUNT_NUMBER: '1050773506'
          BANK_ACCOUNT_NAME: 'NGUYEN DUC QUAN'
          SHOP_NAME: 'QuanNguyenS'
          SHOP_PHONE: '0973 486 218'
          SHOP_ADDRESS: 'Hai Bà Trưng, Hà Nội'
        run: |
          timeout 5s npm start || if [ $? -eq 124 ]; then echo "Server started and ran for 5s cleanly"; else exit $?; fi
