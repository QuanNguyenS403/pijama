name: CI Pipeline & Production Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Test & Security Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install All Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Automated Test Suite (Security, Payment, Stock, Integrity)
        run: npm test

      - name: Build Production Frontend Artifacts
        run: npm run build

      - name: Verify Production Dist Exists
        run: |
          test -d dist
          test -f dist/index.html

      - name: Verify Production Dependencies Only
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Smoke Test Production Startup
        run: |
          timeout 5s npm start || if [ $? -eq 124 ]; then echo "Server started and ran for 5s cleanly"; else exit $?; fi
