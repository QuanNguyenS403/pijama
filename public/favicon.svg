<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#731927" />
      <stop offset="100%" stop-color="#4E0E18" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E1A4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA8222" />
    </linearGradient>
  </defs>

  <!-- Background Base with subtle rounded squircle -->
  <rect width="64" height="64" rx="14" fill="url(#burgundyGrad)" />
  
  <!-- Subtle luxury inner border -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="10.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.85" />

  <!-- Monogram Q for QuanNguyenS -->
  <text 
    x="32" 
    y="44" 
    text-anchor="middle" 
    font-family="'Cormorant Garamond', 'Georgia', 'Playfair Display', serif" 
    font-size="36" 
    font-weight="700" 
    letter-spacing="-0.5"
    fill="url(#goldGrad)"
  >Q</text>
</svg>
