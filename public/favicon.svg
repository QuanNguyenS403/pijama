<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="squircle">
      <rect width="64" height="64" rx="14" />
    </clipPath>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E1A4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA8222" />
    </linearGradient>
  </defs>

  <!-- Base with logo image -->
  <g clip-path="url(#squircle)">
    <image href="/images/logo.jpg" x="0" y="0" width="64" height="64" preserveAspectRatio="xMidYMid slice" />
  </g>
  
  <!-- Subtle luxury inner gold border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.9" />
</svg>

